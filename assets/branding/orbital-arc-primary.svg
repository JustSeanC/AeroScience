  <path d="M93 955 C112 852 640 571 1202 485 C935 521 512 701 232 873 C146 928 154 969 228 990 C159 1014 88 991 93 955Z" fill="url(#arcShade)"/>
  <path d="M93 947 C124 847 648 564 1202 485 C953 514 517 699 240 867 C144 925 163 963 224 983 C151 997 88 980 93 947Z" fill="url(#arc)"/>
