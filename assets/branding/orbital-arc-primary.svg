<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">AeroScience Orbital Arc — primary logo</title>
  <desc id="desc">A thicker-stroked faceted teal letter A intersected by a graceful flight-path arc, on a transparent background.</desc>
  <defs>
    <linearGradient id="left" x1=".14" y1="1" x2=".70" y2="0" objectBoundingBox="true">
      <stop offset="0" stop-color="#03506d"/><stop offset=".53" stop-color="#0cbbbd"/><stop offset="1" stop-color="#62ffed"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="1" x2=".8" y2="0">
      <stop offset="0" stop-color="#00bcbd"/><stop offset=".50" stop-color="#47f4e8"/><stop offset="1" stop-color="#ddffff"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#15dace"/><stop offset=".35" stop-color="#8ffeff"/><stop offset=".76" stop-color="#8ffff5"/><stop offset="1" stop-color="#52e7e4"/>
    </linearGradient>
    <linearGradient id="arcShade" x1="0" y1="1" x2=".8" y2="0">
      <stop offset="0" stop-color="#003448"/><stop offset=".6" stop-color="#005870"/><stop offset="1" stop-color="#053e55"/>
    </linearGradient>
  </defs>
  <!-- Original outer footprint preserved; thicker A legs and narrower central opening. -->
