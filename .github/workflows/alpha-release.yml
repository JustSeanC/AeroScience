name: optional-public-release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Optional automation; the first release can be built locally and uploaded on the Releases website
        type: choice
        options: [build-alpha, publish-built-alpha]
        default: build-alpha
      source_commit:
        description: Exact 40-character source commit (required when publishing an earlier candidate)
        required: false
      sdk_root:
        description: Official SDK root on the optional Windows SDK runner
        default: 'C:\MSFS 2024 SDK'
      runtime_path:
        description: Official native SimConnect.dll path on that runner
        required: false
      runtime_approval_record:
        description: Path to the completed specific runtime redistribution record on that runner
        required: false
      redistribution_confirmed:
        description: Specific redistribution permission has been established for the included native DLL
        type: boolean
        default: false
      inno_compiler:
        description: Optional full ISCC.exe path (Inno Setup 6.3 or newer on the preparation machine)
        required: false
      candidate_run_id:
        description: Earlier successful prepare-candidate workflow run ID (publishing only)
        required: false
permissions:
  contents: read
concurrency:
  group: aeroscience-manual-release
  cancel-in-progress: false
jobs:
  prepare:
    if: inputs.operation == 'build-alpha'
    runs-on: [self-hosted, Windows, X64, msfs2024-sdk]
    env:
      SDK_ROOT: ${{ inputs.sdk_root }}
      SDK_RUNTIME: ${{ inputs.runtime_path }}
      RUNTIME_APPROVAL: ${{ inputs.runtime_approval_record }}
      PERMISSION_CONFIRMED: ${{ inputs.redistribution_confirmed }}
      REQUESTED_COMMIT: ${{ inputs.source_commit }}
      INNO_COMPILER: ${{ inputs.inno_compiler }}
    steps:
      - name: Keep candidate provenance tied to this manually dispatched revision
        shell: pwsh
        run: |
          if ($env:REQUESTED_COMMIT -and $env:REQUESTED_COMMIT -ne $env:GITHUB_SHA) { throw 'Dispatch preparation from the intended source revision; do not substitute another commit.' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and technically validate alpha; hardware acceptance remains not verified
        id: candidate
        shell: pwsh
        run: |
          if ($env:PERMISSION_CONFIRMED -ne 'true') { throw 'Specific runtime permission is unconfirmed.' }
          ./scripts/release/Build-Release.ps1 -SdkRoot $env:SDK_ROOT -RuntimePath $env:SDK_RUNTIME -RuntimeApprovalRecord $env:RUNTIME_APPROVAL -RuntimeRedistributionConfirmed -InnoCompiler $env:INNO_COMPILER
          $commit = (git rev-parse HEAD).Trim()
          "source_commit=$commit" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: AeroScience-alpha-${{ steps.candidate.outputs.source_commit }}
          path: |
            artifacts/installer-candidate/**
            artifacts/build-evidence/**
            artifacts/AeroScience-Setup-v*.exe
            artifacts/AeroScience-Setup-v*.exe.sha256
            artifacts/AeroScience-Setup-v*.release.json
            artifacts/AeroScience-v*-win-x64.zip
            artifacts/AeroScience-v*-win-x64.zip.sha256
            artifacts/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.operation == 'publish-built-alpha'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check required publication inputs
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-fA-F0-9]{40}$' -or $env:CANDIDATE_RUN -notmatch '^[0-9]+$') { throw 'Provide the exact build source commit and successful build run ID.' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - name: Verify candidate came from successful trusted preparation
        shell: pwsh
        run: |
          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify candidate workflow provenance.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.event -ne 'workflow_dispatch' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_COMMIT -or $run.path -ne '.github/workflows/alpha-release.yml') { throw 'The candidate is not from the expected successful manual source revision/workflow.' }
          $jobsJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN/jobs"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify trusted SDK preparation job.' }
          $preparation = @(($jobsJson | ConvertFrom-Json).jobs | Where-Object { $_.name -eq 'prepare' -and $_.conclusion -eq 'success' -and $_.labels -contains 'msfs2024-sdk' })
          if ($preparation.Count -ne 1) { throw 'Missing successful trusted SDK preparation job.' }
      - uses: actions/download-artifact@v8
        with:
          name: AeroScience-alpha-${{ inputs.source_commit }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/
      - name: Require installed acceptance for scientific mission releases
        shell: pwsh
        run: |
          $version = [xml](Get-Content Directory.Build.props -Raw)
          if ([version]$version.Project.PropertyGroup.Version -ge [version]'0.4.0') { throw 'v0.4.0 workflow candidates need actual Windows/MSFS acceptance. Download the candidate, complete docs/v0.4.0-windows-testing.md and finalize/upload manually. This automated publication path cannot supply hardware acceptance.' }
      - name: Revalidate the exact compiled bytes and publish the alpha to this repository
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'JustSeanC/AeroScience') { throw 'Unexpected publication repository.' }
          ./scripts/release/Publish-Release.ps1
