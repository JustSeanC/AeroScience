name: reduced-gis-prototype
on:
  workflow_dispatch:
  push:
    branches: [develop/v0.6.0]
    paths: ['tests/AeroScience.ReducedGisProbe/**', 'src/AeroScience.Missions/AviationChartRaster.cs', 'scripts/build/chart_runtime.py', '.github/workflows/reduced-gis-prototype.yml']
permissions:
  contents: read
jobs:
  reduced-windows:
    if: github.ref == 'refs/heads/develop/v0.6.0'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_MAX_CONCURRENCY: '2'
      VCPKG_DEFAULT_BINARY_CACHE: '${{ runner.temp }}/aeroscience-chart-vcpkg-cache'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: '${{ runner.temp }}/aeroscience-chart-vcpkg-cache'
          key: 'chart-codec-v1-${{ runner.os }}-${{ hashFiles(''tests/AeroScience.ReducedGisProbe/vcpkg.json'', ''tests/AeroScience.ReducedGisProbe/triplets/**'', ''tests/AeroScience.ReducedGisProbe/prepare_port.py'') }}'
      - name: Build the pinned reduced chart codec (research only)
        shell: pwsh
        run: |
          $codecTools = Join-Path $env:RUNNER_TEMP 'reduced-gis-vcpkg'
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          Add-Content $env:GITHUB_ENV "REDUCED_GIS_TOOLS=$codecTools"
          $codecInstall = Join-Path $env:RUNNER_TEMP 'reduced-gis-installed'
          git init $codecTools
          git -C $codecTools remote add origin https://github.com/microsoft/vcpkg.git
          git -C $codecTools fetch --depth 1 origin 1391150599c0b9dc6f2a3c79c50eff6c94b077d1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned build-tool source unavailable.' }
          git -C $codecTools checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned build-tool checkout failed.' }
          python tests/AeroScience.ReducedGisProbe/prepare_port.py --vcpkg $codecTools --receipt artifacts/reduced-gis/port-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'Exact reduced-port verification failed.' }
          & "$codecTools/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'Build-tool bootstrap failed.' }
          & "$codecTools/vcpkg.exe" install --triplet x64-windows-research "--x-manifest-root=$pwd/tests/AeroScience.ReducedGisProbe" "--overlay-triplets=$pwd/tests/AeroScience.ReducedGisProbe/triplets" "--overlay-ports=$codecTools/ports" "--x-install-root=$codecInstall"
          if ($LASTEXITCODE -ne 0) { throw 'Reduced native compilation failed; no bundle substitution.' }
          Add-Content $env:GITHUB_ENV "REDUCED_GIS_INSTALL=$codecInstall/x64-windows-research"
          Copy-Item "$codecInstall/vcpkg/status" artifacts/reduced-gis/dependency-status.txt
          $rows = Get-ChildItem "$codecInstall/x64-windows-research/bin" -Filter '*.dll' | ForEach-Object { @{ name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } }
          $rows | ConvertTo-Json -Depth 4 | Set-Content artifacts/reduced-gis/runtime-files.json
          # Retain source/license evidence, never native binaries or original charts.
          $notices = Get-ChildItem "$codecInstall/x64-windows-research/share" -Filter copyright -Recurse | ForEach-Object { "`nCOMPONENT: $($_.Directory.Name)`n"; Get-Content $_.FullName -Raw }
          $notices | Set-Content artifacts/reduced-gis/component-copyrights.txt
          python tests/AeroScience.ReducedGisProbe/inspect_native.py --folder "$codecInstall/x64-windows-research/bin" --output artifacts/reduced-gis/build-native-imports.json
          if ($LASTEXITCODE -ne 0) { throw 'Complete direct/delay/export inventory failed; per-component diagnostics were retained.' }
          python scripts/build/chart_runtime.py assemble --install "$codecInstall/x64-windows-research" --output "$env:RUNNER_TEMP/chart-runtime-complete" --port-receipt artifacts/reduced-gis/port-receipt.json --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Complete runtime/data/static-notice inventory failed.' }
          Copy-Item "$env:RUNNER_TEMP/chart-runtime-complete/manifest.json" artifacts/reduced-gis/distribution-manifest.json
      - name: Publish locked self-contained probe and exercise the genuine FAA original
        shell: pwsh
        run: |
          dotnet restore tests/AeroScience.ReducedGisProbe --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked research restore failed.' }
          dotnet publish tests/AeroScience.ReducedGisProbe -c Release -r win-x64 --self-contained true --no-restore -o "$env:RUNNER_TEMP/reduced-gis-probe"
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained probe publish failed.' }
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Research publishing changed dependency locks.' }
          # Deploy only the owned DLLs and required CRS database into isolated scratch.
          # Do not rely on runner-installed GDAL/Python/VC runtime or a vcpkg data path.
          $isolated = Join-Path $env:RUNNER_TEMP 'reduced-gis-isolated'
          Copy-Item "$env:RUNNER_TEMP/chart-runtime-complete" $isolated -Recurse
          python scripts/build/chart_runtime.py verify --folder $isolated > artifacts/reduced-gis/distribution-summary.json
          if ($LASTEXITCODE -ne 0) { throw 'Copied distribution manifest/hash/import verification failed.' }
          python tests/AeroScience.ReducedGisProbe/inspect_native.py --folder "$isolated/bin" --output artifacts/reduced-gis/native-imports.json
          if ($LASTEXITCODE -ne 0) { throw 'Native import/deployment inventory incomplete.' }
          python tests/AeroScience.ReducedGisProbe/prepare_chart_samples.py --output "$env:RUNNER_TEMP/chart-family-originals"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned five-family originals unavailable; no substitute or restamp.' }
          $env:PATH = "$isolated/bin;$env:SystemRoot/System32;$env:SystemRoot"
          $env:GDAL_DATA = "$isolated/share/gdal"
          $env:PROJ_DATA = "$isolated/share/proj"
          $env:PROJ_NETWORK = 'OFF'
          $native = @(Get-ChildItem "$isolated/bin" -Filter 'gdal*.dll')
          if ($native.Count -ne 1) { throw 'Ambiguous native GDAL identity.' }
          & "$env:RUNNER_TEMP/reduced-gis-probe/AeroScience.ReducedGisProbe.exe" $native[0].FullName "$env:RUNNER_TEMP/chart-family-originals/Hawaiian Islands SEC.tif" tests/AeroScience.GisProbe/faa-window-reference.json artifacts/reduced-gis/result.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual reduced native loading/window/CRS verification failed.' }
          & "$env:RUNNER_TEMP/reduced-gis-probe/AeroScience.ReducedGisProbe.exe" --chart $isolated "$env:RUNNER_TEMP/chart-family-originals" tests/AeroScience.ReducedGisProbe/chart-window-reference.json artifacts/reduced-gis/chart-application-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual application chart-color/interior/CRS checks failed.' }
      - name: Independently verify application PNGs and private-profile runtime packaging
        shell: pwsh
        run: |
          python tests/AeroScience.ReducedGisProbe/verify_chart_tiles.py --folder artifacts/reduced-gis/chart-native-tiles --reference tests/AeroScience.ReducedGisProbe/chart-window-reference.json --output artifacts/reduced-gis/chart-independent-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent chart PNG integrity/original-color comparison failed.' }
          & ./scripts/build/Publish-ValidationCompanion.ps1 -ArtifactsPath "$env:RUNNER_TEMP/chart-private-intermediate" -OutputDirectory "$env:RUNNER_TEMP/chart-private-companion" -ChartRuntimeDirectory "$env:RUNNER_TEMP/chart-runtime-complete"
          if ($LASTEXITCODE -ne 0) { throw 'Actual isolated companion/chart runtime publish failed.' }
          python scripts/build/chart_runtime.py verify --folder "$env:RUNNER_TEMP/chart-private-companion/ChartRuntime"
          if ($LASTEXITCODE -ne 0) { throw 'Private companion runtime/data/notices identity verification failed.' }
      - name: Retain native target compiler configuration even on failure
        if: always() && env.REDUCED_GIS_TOOLS != ''
        shell: pwsh
        run: |
          python tests/AeroScience.ReducedGisProbe/collect_build.py --root "$env:REDUCED_GIS_TOOLS/buildtrees" --output artifacts/reduced-gis/compiler-settings.json
          if ($LASTEXITCODE -ne 0) { throw 'Native compiler diagnostic inventory failed.' }
      - name: Retain research receipts only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reduced-gis-windows-evidence
          path: |
            artifacts/reduced-gis/*.json
            artifacts/reduced-gis/*.txt
          if-no-files-found: ignore
          retention-days: 14
