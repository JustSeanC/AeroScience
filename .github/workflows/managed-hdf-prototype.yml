name: managed-hdf-prototype
on:
  workflow_dispatch:
  push:
    branches: [develop/v0.6.0]
    paths: ['tests/AeroScience.ManagedHdfProbe/**', 'tests/AeroScience.SafeHdfSource/**', '.github/workflows/managed-hdf-prototype.yml']
permissions:
  contents: read
jobs:
  managed-research:
    if: github.ref == 'refs/heads/develop/v0.6.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: AeroScience.ManagedHdfProbe
          - os: windows-latest
            rid: win-x64
            executable: AeroScience.ManagedHdfProbe.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify pinned source and prepare the pre-resolution restricted reader
        shell: pwsh
        run: |
          $hdfSource = Join-Path $env:RUNNER_TEMP 'aeroscience-pinned-hdf-source'
          git init $hdfSource
          git -C $hdfSource remote add origin https://github.com/Apollo3zehn/PureHDF.git
          git -C $hdfSource fetch --depth 1 origin c2cea464ad2a6649258ab14c8d798cb6239b9e1e
          if ($LASTEXITCODE -ne 0) { throw 'Exact managed reader source unavailable.' }
          # Verify exact Git blob bytes, unaffected by the Windows runner's global CRLF policy.
          git -C $hdfSource -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned reader source checkout failed.' }
          python tests/AeroScience.ManagedHdfProbe/prepare_hdf_read.py --source $hdfSource --output tests/AeroScience.SafeHdfSource/obj/pinned
          if ($LASTEXITCODE -ne 0) { throw 'Source hash/policy/notice validation failed; no upstream package substitution.' }
      - name: Locked isolated research publish and actual execution
        shell: pwsh
        run: |
          dotnet restore tests/AeroScience.ManagedHdfProbe --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Managed research locked restore failed.' }
          dotnet publish tests/AeroScience.ManagedHdfProbe -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o artifacts/managed-hdf-research
          if ($LASTEXITCODE -ne 0) { throw 'Managed research publish failed.' }
          & ./artifacts/managed-hdf-research/${{ matrix.executable }} | Tee-Object -FilePath artifacts/managed-hdf-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual managed storage/window probe failed.' }
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Managed research changed dependency locks.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: managed-hdf-${{ matrix.rid }}
          path: |
            artifacts/managed-hdf-result.json
            tests/AeroScience.SafeHdfSource/obj/pinned/policy-receipt.json
          if-no-files-found: ignore
          retention-days: 14
