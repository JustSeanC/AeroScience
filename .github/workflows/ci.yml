name: foundation
on:
  workflow_dispatch:
    inputs:
      validation:
        description: 'Validation scope (full is required at milestones and before release integration)'
        required: true
        default: full
        type: choice
        options: [fast, full, windows-profile]
  push:
    paths-ignore:
      - 'docs/roadmap/**'
  pull_request:
    paths-ignore:
      - 'docs/roadmap/**'
concurrency:
  # Routine development pushes cannot cancel a manually requested or milestone full run.
  group: foundation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.validation || (contains(github.event.head_commit.message, '[full-validation]') && 'milestone-full' || 'routine') }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[full-validation]') }}
permissions:
  contents: read
jobs:
  validation-scope:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        env:
          REQUESTED: ${{ inputs.validation }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/build/development_validation.py tier
  development:
    needs: validation-scope
    if: needs.validation-scope.outputs.tier == 'fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Select conservative affected checks
        env:
          CHANGE_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/build/development_validation.py plan --base "$CHANGE_BASE"
      - run: dotnet restore AeroScience.sln --locked-mode
      - run: dotnet build AeroScience.sln -c Release --no-restore --nologo
      - run: python3 scripts/build/development_validation.py dotnet
      - run: npm ci --ignore-scripts
      - name: Validate native Railway configuration offline
        run: npm ci --ignore-scripts --prefix deploy/organization/railway && npm test --prefix deploy/organization/railway
      - run: npm run check:branding
      - run: npm run check:web
      - run: python3 scripts/build/verify_web_assets.py
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build/development_validation.py browser
      - run: python3 scripts/build/development_validation.py helpers
      - name: Retain development scope and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-validation
          path: |
            artifacts/development-plan.json
            artifacts/web-results.json
            artifacts/browser-tests/**
            artifacts/browser-server/**
            tests/AeroScience.Tests/TestResults/**/*.trx
            tests/AeroScience.Tests/TestResults/**/Sequence_*.xml
          if-no-files-found: ignore
          retention-days: 7
  windows-profile:
    needs: validation-scope
    if: needs.validation-scope.outputs.tier == 'windows-profile'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test profile isolation, toolbar installation and HDF worker protocol
        shell: pwsh
        run: |
          dotnet restore AeroScience.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }
          dotnet test tests/AeroScience.Tests -c Release --no-restore --filter 'FullyQualifiedName~ValidationIsolationTests|FullyQualifiedName~ModeAndToolbarTests|FullyQualifiedName~ToolbarInstallTests|FullyQualifiedName~ScientificHdfReaderTests|FullyQualifiedName~DiscordTransportTests|FullyQualifiedName~DiscordWebhookPolicyTests' --logger 'trx;LogFileName=windows-profile.trx' --blame-hang-timeout 2m --blame-hang-dump-type none
          if ($LASTEXITCODE -ne 0) { throw 'Windows isolation/protocol tests failed.' }
      - name: Publish production and isolated validation graphs (not distributable)
        shell: pwsh
        run: |
          dotnet publish src/AeroScience.Desktop -c Release -r win-x64 --self-contained true --no-restore -o artifacts/Windows-Companion
          if ($LASTEXITCODE -ne 0) { throw 'Production Windows compilation failed.' }
          python scripts/build/verify_desktop_branding.py --folder artifacts/Windows-Companion
          if ($LASTEXITCODE -ne 0) { throw 'Production Windows icon resources failed verification.' }
          ./scripts/build/Publish-ValidationCompanion.ps1 -ArtifactsPath artifacts/validation-probe -OutputDirectory artifacts/Windows-Validation-Structural
      - name: Verify dependency locks remain unchanged
        if: always()
        shell: pwsh
        run: |
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Publishing modified committed dependency locks.' }
      - name: Retain focused Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-profile-diagnostics
          path: tests/AeroScience.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
      # Manual diagnostic scope only; never substitutes for either full platform job.
  linux:
    needs: validation-scope
    if: needs.validation-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest
    services:
      organization-postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: aeroscience_test
          POSTGRES_PASSWORD: p13_disposable_loopback_only
          POSTGRES_DB: aeroscience_org_tests
        ports:
          - 55437:5432
        options: --health-cmd "pg_isready -U aeroscience_test -d aeroscience_org_tests" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AEROSCIENCE_ORG_TEST_DATABASE: Host=127.0.0.1;Port=55437;Database=aeroscience_org_tests;Username=aeroscience_test;Password=p13_disposable_loopback_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: dotnet restore AeroScience.sln --locked-mode
      - name: Verify independently compiled private validation identity
        run: dotnet run --project tests/AeroScience.TestHost -c Release --artifacts-path artifacts/validation-probe -p:AeroScienceValidation=true -p:RestoreLockedMode=true -- --profile-probe
      - name: Install pinned native recovery tools for actual PostgreSQL restore acceptance
        run: python3 scripts/deployment/install_recovery_test_tools.py
      - run: dotnet test AeroScience.sln -c Release --no-restore --logger trx --logger 'console;verbosity=normal' --blame-hang-timeout 2m --blame-hang-dump-type none
      - name: Retain Linux test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-diagnostics
          path: |
            tests/AeroScience.Tests/TestResults/**/*.trx
            tests/AeroScience.Tests/TestResults/**/Sequence_*.xml
          if-no-files-found: ignore
          retention-days: 7
      - run: npm ci --ignore-scripts
      - name: Validate native Railway configuration offline
        run: npm ci --ignore-scripts --prefix deploy/organization/railway && npm test --prefix deploy/organization/railway
      - run: npm run check:branding
      - run: npm run check:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-browser-diagnostics
          path: |
            artifacts/web-results.json
            artifacts/browser-tests/**
            artifacts/browser-server/**
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and exercise real recovery test host
        run: |
          dotnet build tests/AeroScience.TestHost -c Release --no-restore --nologo --output artifacts/recovery-test-host
          python3 scripts/build/smoke_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          python3 scripts/build/smoke_evidence_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          python3 scripts/build/smoke_library_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          python3 scripts/build/smoke_source_deletion.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          python3 scripts/build/smoke_aviation_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
  windows-companion:
    needs: validation-scope
    if: needs.validation-scope.outputs.tier == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare isolated organization PostgreSQL when available
        shell: pwsh
        run: ./scripts/build/Start-OrganizationTestPostgres.ps1
      - name: Use runner scratch for durable Windows test fixtures
        shell: pwsh
        run: |
          $systemTemp = [IO.Path]::GetTempPath()
          $testScratch = Join-Path $env:RUNNER_TEMP 'aeroscience-test-storage'
          [IO.Directory]::CreateDirectory($testScratch) | Out-Null
          foreach ($base in @($systemTemp, $testScratch)) {
            $probe = Join-Path $base ('aeroscience-flush-' + [Guid]::NewGuid().ToString('N'))
            $stream = $null
            try {
              $stream = [IO.File]::Open($probe, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
              $buffer = [byte[]]::new(4096)
              $timer = [Diagnostics.Stopwatch]::StartNew()
              for ($i = 0; $i -lt 16; $i++) { $stream.Write($buffer, 0, $buffer.Length); $stream.Flush($true) }
              $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($base))
              Write-Host ('Durable scratch probe: {0}; format={1}; 16 flushed 4-KiB writes={2:N1} ms' -f $base, $drive.DriveFormat, $timer.Elapsed.TotalMilliseconds)
            } finally {
              if ($null -ne $stream) { $stream.Dispose() }
              if ([IO.File]::Exists($probe)) { [IO.File]::Delete($probe) }
            }
          }
          # Test fixtures use the runner's intended scratch volume, not its busy OS disk.
          # No production storage setting, SQLite durability or deadline changes.
          Add-Content -LiteralPath $env:GITHUB_ENV -Value @("TEMP=$testScratch", "TMP=$testScratch") -Encoding utf8
      - shell: pwsh
        run: ./scripts/build/Build-Companion.ps1
      - name: Compile isolated validation identity and Windows application (not distributable)
        shell: pwsh
        run: ./scripts/build/Publish-ValidationCompanion.ps1 -ArtifactsPath artifacts/validation-probe -OutputDirectory artifacts/Windows-Validation-Structural
      - name: Verify Windows Earthdata vault with disposable synthetic credentials
        shell: pwsh
        run: |
          dotnet run --project tests/AeroScience.TestHost -c Release --no-restore -- --earthdata-vault-probe
          if ($LASTEXITCODE -ne 0) { throw 'Windows Earthdata credential protection/isolation failed.' }
      - name: Verify dependency locks remain unchanged
        if: always()
        shell: pwsh
        run: |
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Publishing modified committed dependency locks.' }
      - name: Retain Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-diagnostics
          path: |
            tests/AeroScience.Tests/TestResults/**/*.trx
            tests/AeroScience.Tests/TestResults/**/Sequence_*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Check Windows-sensitive helpers and installer packaging
        shell: pwsh
        run: |
          python scripts/build/development_validation.py windows-helpers
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging/helper checks failed.' }
      - shell: pwsh
        env:
          Platform: x64
        run: |
          dotnet build tests/AeroScience.TestHost -c Release --no-restore --nologo --output artifacts/recovery-test-host
          if ($LASTEXITCODE -ne 0) { throw 'Recovery test host build failed.' }
          python scripts/build/smoke_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          if ($LASTEXITCODE -ne 0) { throw 'Recovery smoke failed.' }
          python scripts/build/smoke_evidence_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          if ($LASTEXITCODE -ne 0) { throw 'Science session evidence recovery smoke failed.' }
          python scripts/build/smoke_library_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          if ($LASTEXITCODE -ne 0) { throw "Library recovery failed" }
          python scripts/build/smoke_source_deletion.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          if ($LASTEXITCODE -ne 0) { throw 'Scientific Library recovery smoke failed.' }
          python scripts/build/smoke_aviation_recovery.py --host-dll artifacts/recovery-test-host/AeroScience.TestHost.dll
          if ($LASTEXITCODE -ne 0) { throw 'Aviation original recovery smoke failed.' }
      - name: Compile installer recipe with structural fixtures only
        shell: pwsh
        run: |
          . ./scripts/release/InnoSetup.ps1
          $compiler = Resolve-InnoSetupCompiler
          $compilerVersion = Get-InnoSetupCompilerVersion -CompilerPath $compiler
          Write-Host "Compiler engine: $compilerVersion ($compiler)"
          $fixture = Join-Path $env:RUNNER_TEMP 'inno-fixture'
          New-Item $fixture -ItemType Directory | Out-Null
          Set-Content "$fixture\LICENSE" 'STRUCTURAL COMPILER TEST ONLY; NOT A DISTRIBUTION'
          Set-Content "$fixture\dummy.txt" 'NOT APPLICATION OR SDK OUTPUT'
          Set-Content "$fixture\VC_redist.x64.exe" 'NOT A RUNTIME; NEVER EXECUTE THIS FIXTURE INSTALLER'
          & $compiler "/DPayloadDir=$fixture" "/DVcRuntime=$fixture\VC_redist.x64.exe" "/DReleaseVersion=$(([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version)" "/DPackageVersion=$(([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version)" "/DOutputDirectory=$fixture\output" scripts/installer/AeroScience.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer recipe compilation failed.' }
          # Compile only: no fake SDK receipt, executable launch, acceptance or artifact publication.
      # Public-repository CI validates builds without publishing alpha binaries.
      # Release publication is an explicit maintainer action, not a push side effect.
  organization-deployment:
    needs: validation-scope
    if: needs.validation-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build real retained-evidence fixture with locked dependencies
        run: |
          dotnet restore tests/AeroScience.TestHost --locked-mode
          dotnet build tests/AeroScience.TestHost -c Release --no-restore --nologo -o artifacts/browser-test-host
      - name: Build pinned non-root organization container from accepted source
        run: docker build -f deploy/organization/Dockerfile --build-arg SOURCE_REVISION="$GITHUB_SHA" -t aeroscience-organization:validation .
      - name: Verify HTTPS, PostgreSQL TLS, secure ownership, evidence receipt and container replacement
        run: python3 scripts/deployment/verify_organization_container.py --image aeroscience-organization:validation --output artifacts/organization-deployment/acceptance.json
      - name: Build pinned recovery and Railway runtime candidates (not public distributions)
        run: |
          docker build -f deploy/organization/Dockerfile.operations --build-arg ORGANIZATION_IMAGE=aeroscience-organization:validation -t aeroscience-organization-operations:validation .
          docker run --rm --entrypoint /operations/bin/restic aeroscience-organization-operations:validation version
          docker run --rm -e LD_LIBRARY_PATH=/operations/lib --entrypoint /operations/bin/pg_dump aeroscience-organization-operations:validation --version
          docker run --rm -e LD_LIBRARY_PATH=/operations/lib --entrypoint /operations/bin/pg_restore aeroscience-organization-operations:validation --version
          docker build -f deploy/organization/railway/Dockerfile.application -t aeroscience-railway-application:validation .
          docker build -f deploy/organization/railway/Dockerfile.database --build-arg SOURCE_REVISION="$GITHUB_SHA" -t aeroscience-railway-postgres:validation .
      - name: Verify real private database CA, root-owned volume and permanent non-root application
        run: python3 scripts/deployment/verify_railway_runtime.py --application aeroscience-railway-application:validation --database aeroscience-railway-postgres:validation --output artifacts/organization-deployment/railway-runtime.json
      - name: Verify exact private distribution image identities and parent layers (no publication)
        run: python3 scripts/deployment/inspect_organization_images.py --source "$GITHUB_SHA" --output artifacts/organization-deployment/image-review.json
      - name: Retain bounded deployment acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: organization-deployment-diagnostics
          path: artifacts/organization-deployment/**
          if-no-files-found: ignore
          retention-days: 7
