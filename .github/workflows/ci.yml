name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: dotnet restore AeroScience.sln --locked-mode
      - run: dotnet test AeroScience.sln -c Release --no-restore --logger trx
      - run: npm ci --ignore-scripts
      - run: npm run check:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/build/smoke_recovery.py
  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./scripts/build/Build-Companion.ps1
      - shell: pwsh
        run: |
          dotnet build tests/AeroScience.TestHost -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Recovery test host build failed.' }
          python scripts/build/smoke_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'Recovery smoke failed.' }
      # Public-repository CI validates builds without publishing alpha binaries.
      # Restricted distribution is an explicit maintainer workflow, not a push side effect.
